<!DOCTYPE html>
<html lang="tet">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Sistema Estudante Ativo - Suco Dato-Tolu</title>
 <!-- Tailwind CSS -->
 <script src="https://cdn.tailwindcss.com"></script>
 <!-- Google Fonts: Inter -->
 <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
 <!-- Font Awesome Icons -->
 <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
 <script>
 tailwind.config = {
 theme: {
 extend: {
 fontFamily: { sans: ['Inter', 'sans-serif'] },
 colors: {
 navy: { 800: '#1B365D', 900: '#112440' },
 gold: { 500: '#D69E2E', 600: '#B7791F' }
 }
 }
 }
 }
 </script>
 <style>
 ::-webkit-scrollbar { width: 6px; height: 6px; }
 ::-webkit-scrollbar-track { background: #f1f5f9; }
 ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
 .tab-active { background-color: #1B365D; color: #ffffff; border-bottom: 3px solid #D69E2E; }
 .mobile-nav-active { color: #1B365D; font-weight: 700; }
 .mobile-nav-active i { color: #D69E2E; }
 </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans antialiased min-h-screen flex flex-col">

 <!-- 1. LOGIN SCREEN -->
 <div id="login-screen" class="fixed inset-0 bg-slate-900 flex items-center justify-center p-4 z-50">
 <div class="bg-white w-full max-w-md rounded-2xl shadow-2xl overflow-hidden border border-slate-200">
 <div class="bg-[#1B365D] p-6 text-center relative overflow-hidden">
 <div class="w-16 h-16 bg-[#D69E2E] text-[#112440] rounded-2xl flex items-center justify-center mx-auto mb-3 shadow-lg text-2xl font-bold">
 <i class="fa-solid fa-graduation-cap"></i>
 </div>
 <h1 class="text-white text-xl font-bold tracking-wide">ESTUDANTE ATIVO</h1>
 <p class="text-[#D69E2E] text-sm font-semibold uppercase tracking-wider mt-0.5">Suco Dato-Tolu</p>
 <p class="text-slate-300 text-xs mt-2">Sistema Jestaun Dadus & Administrasaun</p>
 </div>

 <form id="login-form" class="p-6 space-y-4">
 <div id="login-error" class="hidden bg-red-50 border-l-4 border-red-500 text-red-700 p-3 rounded text-sm flex items-center gap-2">
 <i class="fa-solid fa-circle-exclamation"></i>
 <span>Username ka Password sala! Favor koko fila fali.</span>
 </div>

 <div>
 <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Username Administradór</label>
 <div class="relative">
 <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400">
 <i class="fa-solid fa-user"></i>
 </span>
 <input type="text" id="login-username" required placeholder="Hatama username..."
 class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#1B365D] focus:bg-white transition text-sm">
 </div>
 </div>

 <div>
 <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Password</label>
 <div class="relative">
 <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400">
 <i class="fa-solid fa-lock"></i>
 </span>
 <input type="password" id="login-password" required placeholder="Hatama password..."
 class="w-full pl-10 pr-10 py-2.5 bg-slate-50 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#1B365D] focus:bg-white transition text-sm">
 <button type="button" onclick="togglePasswordVisibility()" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-600">
 <i id="eye-icon" class="fa-solid fa-eye"></i>
 </button>
 </div>
 </div>

 <button type="submit" class="w-full bg-[#1B365D] hover:bg-[#112440] text-white font-semibold py-3 rounded-xl shadow-md transition flex items-center justify-center gap-2">
 <i class="fa-solid fa-right-to-bracket"></i>
 <span>Tama nu'udar Administradór</span>
 </button>

 <div class="pt-3 border-t border-slate-100">
 <button type="button" onclick="enterPublicMode()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2.5 rounded-xl shadow-sm transition flex items-center justify-center gap-2 text-sm">
 <i class="fa-solid fa-eye"></i>
 <span>Aksesu Públiku (Haree De'it)</span>
 </button>
 </div>
 </form>
 </div>
 </div>

 <!-- 2. MAIN APPLICATION -->
 <div id="app-container" class="hidden flex-1 flex flex-col pb-20 md:pb-6">
 <header class="bg-navy-800 text-white shadow-md sticky top-0 z-30">
 <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
 <div class="flex items-center gap-3">
 <div class="w-10 h-10 bg-gold-500 text-navy-900 rounded-xl flex items-center justify-center font-bold text-lg shadow">
 <i class="fa-solid fa-graduation-cap"></i>
 </div>
 <div>
 <div class="flex items-center gap-2">
 <h1 class="font-bold text-base sm:text-lg leading-tight">Estudante Ativo Dato-Tolu</h1>
 <span id="role-badge" class="text-[10px] font-bold uppercase px-2 py-0.5 rounded-full bg-gold-500 text-navy-900">Admin</span>
 </div>
 <p class="text-[11px] text-slate-300 font-medium">Portal Organizasaun & Eventu</p>
 </div>
 </div>

 <nav class="hidden md:flex items-center space-x-1 h-full">
 <button onclick="switchTab('dashboard')" id="desk-tab-dashboard" class="desk-nav-btn tab-active px-3.5 h-full flex items-center gap-2 text-sm font-medium transition"><i class="fa-solid fa-chart-pie"></i> Dashboard</button>
 <button onclick="switchTab('database')" id="desk-tab-database" class="desk-nav-btn px-3.5 h-full flex items-center gap-2 text-sm font-medium text-slate-300 hover:text-white transition"><i class="fa-solid fa-users"></i> Membru</button>
 <button onclick="switchTab('search')" id="desk-tab-search" class="desk-nav-btn px-3.5 h-full flex items-center gap-2 text-sm font-medium text-slate-300 hover:text-white transition"><i class="fa-solid fa-magnifying-glass"></i> Pesquisa</button
